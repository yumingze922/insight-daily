<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日深度思辨 · AI产品经理思维训练</title>

  <!-- PWA Meta -->
  <meta name="theme-color" content="#1C1915">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="深度思辨">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- 顶部导航 -->
    <header class="top-bar">
      <div class="brand">
        <div class="brand-seal">思</div>
        <div class="brand-text">
          <h1>每日深度思辨</h1>
          <span>AI产品经理思维训练</span>
        </div>
      </div>

      <div class="top-bar-right">
        <span class="date-display" id="current-date"></span>
        <a href="#" class="nav-link active" data-view="home">要闻</a>
        <a href="#" class="nav-link" data-view="history">往期</a>
      </div>
    </header>

    <!-- 每日古籍引用 -->
    <div id="daily-quote"></div>

    <!-- 主内容区 -->
    <main id="main-content">
      <div class="loading-spinner">研墨备纸中...</div>
    </main>
  </div>

  <script src="js/data.js?v=3"></script>
  <script src="js/dialogue.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
  <script>
    // 显示当前日期
    const dateEl = document.getElementById('current-date');
    const now = new Date();
    const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
    dateEl.textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 · 星期${weekDays[now.getDay()]}`;

    // 注册 Service Worker（PWA 离线缓存）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(
          (registration) => {
            console.log('SW 注册成功:', registration.scope);
          },
          (error) => {
            console.log('SW 注册失败:', error);
          }
        );
      });
    }
  </script>
</body>
</html>
