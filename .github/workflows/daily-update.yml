name: 每日深度思辨 · 自动更新

on:
  schedule:
    # 北京时间每天早上 7:00 (UTC 23:00)
    - cron: '0 23 * * *'
  workflow_dispatch:
    # 允许手动触发

jobs:
  daily-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许提交并推送数据文件

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install httpx

      - name: 执行每日更新
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          BASE_URL: ${{ vars.BASE_URL || 'https://1bb5b1f19fe64920b4aff8618fd1c1a0.sh3.agentos-app.net' }}
        run: |
          python scripts/daily_update.py

      - name: 提交更新的数据文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/ .github/workflows/ .gitignore
          if git diff --staged --quiet; then
            echo "没有新数据，跳过提交"
          else
            git commit -m "📰 每日更新：$(date +%Y-%m-%d) 思辨数据"
            git push
            echo "✅ 数据已提交并推送"
          fi
